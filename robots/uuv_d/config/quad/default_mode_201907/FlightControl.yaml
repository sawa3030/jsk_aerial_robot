aerial_robot_control_name: aerial_robot_control/uuv_d_controller

controller:
  xy:
    p_gain: 5.0
    i_gain: 1.0
    d_gain: 3.0
    limit_sum: 4.0
    limit_p: 12.0
    limit_i: 12.0
    limit_d: 12.0

  z:
    p_gain: 1.0
    i_gain: 1.5
    d_gain: 2.5
    limit_err_p: 1.0
    limit_sum: 25.0 # N for clamping thrust force
    limit_p: 25.0
    limit_i: 25.0
    limit_d: 25.0
    force_landing_descending_rate: -0.5
  
  roll_pitch:
    p_gain: 2.0
    i_gain: 0.0
    d_gain: 0.2
    limit_sum: 50.0
    limit_p: 50.0
    limit_i: 50.0
    limit_d: 50.0

    start_rp_integration_height: 0.3


  yaw:
    p_gain: 4.0
    i_gain: 2.0
    d_gain: 1.0
    limit_err_p: 20
    limit_sum: 20.0
    limit_p: 30
    limit_i: 20.0
    limit_d: 20.0

    need_d_control: true

    trans_constraint_weight: 100
    att_control_weight: 1    
    min_acc_for_attitude: 0.05 # [m/s^2]
    min_vertical_ref: 0.1
    min_b3_z: 0.1
